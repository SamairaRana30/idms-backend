services:
  - type: web
    name: idms-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:10000 --workers 2 --timeout 120
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DEV_DATABASE_URL
        sync: false
      - key: STAGING_DATABASE_URL
        sync: false
      - key: PROD_DATABASE_URL
        sync: false
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
