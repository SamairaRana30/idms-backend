{% extends "base.html" %}
{% block body_class %}login-page{% endblock %}
{% block title %}Login - {{ settings.APP_NAME }}{% endblock %}
{% block content %}
<div class="login-card">
    <div class="login-header">
        <div class="logo-icon"><i class="bi bi-whatsapp"></i></div>
        <h3 class="mb-1">WhatsApp Analytics</h3>
        <p class="mb-0 opacity-75 small">Organization X · Sprint 4</p>
    </div>
    <div class="login-body">
        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-wa w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>
        <p class="text-muted small mt-4 mb-0 text-center">
            Default credentials: <strong>admin</strong> / <strong>admin123</strong>
        </p>
    </div>
</div>
{% endblock %}
