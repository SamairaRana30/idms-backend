{% if groups is defined %}
<div class="group-selector-card">
    <label for="groupSelect"><i class="bi bi-chat-dots-fill me-1"></i> Group</label>
    <select id="groupSelect" class="form-select form-select-sm border-0 bg-transparent">
        <option value="">Select a group</option>
        {% for group in groups %}
        <option value="{{ group.id }}">{{ group.group_name }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
