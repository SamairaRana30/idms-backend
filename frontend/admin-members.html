<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Admin – Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <div class="nav-section">Main</div>
      <a href="/frontend/dashboard.html"     class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
      <div class="nav-section">Management</div>
      <a href="/frontend/members.html"       class="nav-item"><i class="bi bi-people nav-icon"></i> Members</a>
      <a href="/frontend/admin-members.html" class="nav-item active admin-only"><i class="bi bi-shield-check nav-icon"></i> Admin Members</a>
      <a href="/frontend/documents.html"     class="nav-item"><i class="bi bi-folder nav-icon"></i> Documents</a>
      <a href="/frontend/voting.html"        class="nav-item"><i class="bi bi-check2-square nav-icon"></i> Voting</a>
      <a href="/frontend/meetings.html"      class="nav-item"><i class="bi bi-calendar-event nav-icon"></i> Meetings</a>
      <a href="/frontend/calendar.html"      class="nav-item"><i class="bi bi-calendar3 nav-icon"></i> Calendar</a>
      <div class="nav-section">Communication</div>
      <a href="/frontend/notifications.html" class="nav-item"><i class="bi bi-bell nav-icon"></i> Notifications</a>
      <a href="/frontend/chat.html"          class="nav-item"><i class="bi bi-chat-dots nav-icon"></i> Chat</a>
      <div class="nav-section">Finance</div>
      <a href="/frontend/finances.html"      class="nav-item"><i class="bi bi-wallet2 nav-icon"></i> Finances</a>
      <a href="/frontend/analytics.html"     class="nav-item admin-only"><i class="bi bi-bar-chart nav-icon"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/frontend/profile.html" class="nav-item"><i class="bi bi-person-circle nav-icon"></i> Profile</a>
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h1>Admin – Members</h1>
      <span class="text-muted" style="font-size:13px" id="memberCount"></span>
    </div>

    <div class="card">
      <div class="d-flex justify-content-between align-items-center mb-3" style="flex-wrap:wrap;gap:10px">
        <div class="card-title mb-0">Member List</div>
      </div>
      <div class="mb-3">
        <input id="searchInput" class="form-control form-control-sm"
               placeholder="Search by name, email, or role…"
               oninput="filterTable(this.value)"
               style="max-width:360px">
      </div>
      <div style="overflow-x:auto">
        <table class="users-table" id="membersTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="membersBody">
            <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div id="paginationControls" class="d-flex align-items-center mt-3" style="flex-wrap:wrap;gap:6px"></div>
    </div>
  </div>

  <!-- Edit member modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input id="editName" type="text" class="form-control" placeholder="Full name">
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="editRole" class="form-select">
              <option value="member">Member</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-check">
            <input id="editActive" type="checkbox" class="form-check-input">
            <label class="form-check-label" for="editActive">Active account</label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="saveEdit()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Deactivate / activate confirmation modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Action</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="deleteModalBody" style="color:var(--text-secondary)">
          Are you sure?
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" onclick="deleteConfirmed()">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <!-- Admin guard: redirect non-admins before admin-members.js loads -->
  <script>
    if (localStorage.getItem('role') !== 'admin') {
      window.location.href = '/frontend/index.html';
    }
  </script>
  <script src="/frontend/js/admin-members.js"></script>
  <script>
    // Keep member count in topbar in sync
    const _origApplyFilter = applyFilter;
    const _countEl = document.getElementById('memberCount');
    function applyFilter() {
      _origApplyFilter();
      if (_countEl) _countEl.textContent = `${allMembers.length} total members`;
    }
  </script>
</body>
</html>
