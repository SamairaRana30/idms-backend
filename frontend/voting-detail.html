<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Ballot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <style>
    .option-label { display:flex; align-items:center; gap:12px; padding:14px 16px; border:1.5px solid #e2e8f0; border-radius:10px; cursor:pointer; transition:border-color .15s,background .15s; margin-bottom:10px; }
    .option-label:hover { border-color:#4f46e5; background:#fafbff; }
    .option-label input[type=radio]:checked + span { font-weight:600; color:#4f46e5; }
    input[type=radio]:checked ~ .option-label { border-color:#4f46e5; }
    .result-bar { height:28px; background:linear-gradient(90deg,#4f46e5,#7c3aed); border-radius:6px; transition:width .6s ease; min-width:4px; }
    .result-row { margin-bottom:14px; }
    .result-label { font-size:13px; font-weight:500; margin-bottom:4px; display:flex; justify-content:space-between; }
    .result-track { background:#f1f5f9; border-radius:6px; overflow:hidden; }
    .turnout-badge { background:#ede9fe; color:#5b21b6; font-size:12px; font-weight:600; padding:4px 12px; border-radius:20px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <a href="/frontend/dashboard.html"     class="nav-item">Dashboard</a>
      <a href="/frontend/members.html"       class="nav-item admin-only">Members</a>
      <a href="/frontend/documents.html"     class="nav-item">Documents</a>
      <a href="/frontend/voting.html"        class="nav-item">Voting</a>
      <a href="/frontend/meetings.html"      class="nav-item">Meetings</a>
      <a href="/frontend/finances.html"      class="nav-item">Finances</a>
      <a href="/frontend/notifications.html" class="nav-item">Notifications</a>
      <a href="/frontend/analytics.html"     class="nav-item admin-only">Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <div>
        <a href="/frontend/voting.html" class="text-muted" style="font-size:13px;text-decoration:none">← Back to Voting</a>
        <h1 id="ballotTitle" class="mt-1">Loading…</h1>
      </div>
      <div class="d-flex gap-2" id="adminControls" style="display:none!important"></div>
    </div>

    <div id="ballotContent"></div>
  </div>

  <!-- Vote Confirmation Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Confirm Vote</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p style="font-size:13px">You are voting for: <strong id="confirmOption"></strong></p>
          <p class="text-muted" style="font-size:12px">This cannot be changed after submission.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary btn-sm" id="confirmVoteBtn">Confirm Vote</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    const params   = new URLSearchParams(window.location.search);
    const ballotId = params.get('id');
    const showResults = params.get('results') === '1';
    let selectedOptionId   = null;
    let selectedOptionText = null;
    let chartInstance      = null;

    if (!ballotId) window.location.href = '/frontend/voting.html';

    async function loadBallot() {
      const res = await apiGetBallot(ballotId);
      if (!res.success) {
        document.getElementById('ballotContent').innerHTML =
          `<div class="card"><p class="text-danger">${res.error}</p></div>`;
        return;
      }

      const { ballot, options, vote_counts, has_voted } = res.data;
      const isAdmin   = getRole() === 'admin';
      const isClosed  = ballot.status === 'closed';
      const isOpen    = ballot.status === 'open';

      document.getElementById('ballotTitle').innerText = ballot.title;
      document.title = `IDMS | ${ballot.title}`;

      // Admin controls
      if (isAdmin) {
        const ctrl = document.getElementById('adminControls');
        ctrl.style.display = 'flex';
        ctrl.innerHTML = `
          ${ballot.status === 'draft' ? `<button class="btn btn-sm btn-success" onclick="changeStatus('open')">Publish</button>` : ''}
          ${ballot.status === 'open'  ? `<button class="btn btn-sm btn-warning" onclick="changeStatus('close')">Close Ballot</button>` : ''}
          <button class="btn btn-sm btn-outline-secondary" onclick="exportCSV()">Export CSV</button>
        `;
      }

      let html = `<div class="card">
        <p class="text-muted mb-1" style="font-size:13px">${ballot.description || ''}</p>`;

      if (ballot.start_date) {
        html += `<small class="text-muted">${new Date(ballot.start_date).toLocaleDateString()} – ${ballot.end_date ? new Date(ballot.end_date).toLocaleDateString() : '—'}</small>`;
      }
      html += `</div>`;

      const showResultsView = isClosed || showResults || (isAdmin && has_voted);

      if (isOpen && !has_voted && !showResults) {
        // Voting form
        html += `<div class="card">
          <h2 class="card-title">Cast Your Vote</h2>
          <form id="voteForm">
            ${options.map(o => `
              <label class="option-label" onclick="selectOption('${o.id}','${o.text.replace(/'/g,"\\'")}')">
                <input type="radio" name="vote" value="${o.id}" style="accent-color:#4f46e5">
                <span>${o.text}</span>
              </label>
            `).join('')}
          </form>
          <p id="voteMsg" class="text-danger mt-2" style="font-size:13px"></p>
          <button class="btn btn-primary mt-2" onclick="submitVote()">Submit Vote</button>
        </div>`;
      } else if (isOpen && has_voted) {
        html += `<div class="card text-center py-4">
          <div style="font-size:40px">✅</div>
          <h5 class="mt-2">You have already voted</h5>
          <p class="text-muted" style="font-size:13px">Results will be visible once the ballot closes.</p>
        </div>`;
      }

      if (showResultsView) {
        const resultsRes = await apiGetBallotResults(ballotId);
        if (resultsRes.success) {
          const { results, total_votes, turnout_percent } = resultsRes.data;
          html += `<div class="card">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="card-title mb-0">Results</h2>
              <span class="turnout-badge">Turnout: ${turnout_percent}%</span>
            </div>
            <p class="text-muted mb-3" style="font-size:13px">Total votes: ${total_votes}</p>
            ${results.map(r => `
              <div class="result-row">
                <div class="result-label">
                  <span>${r.text}</span>
                  <span>${r.votes} votes (${r.percentage}%)</span>
                </div>
                <div class="result-track">
                  <div class="result-bar" style="width:${r.percentage}%"></div>
                </div>
              </div>
            `).join('')}
            <canvas id="resultsChart" class="mt-4" style="max-height:250px"></canvas>
          </div>`;

          document.getElementById('ballotContent').innerHTML = html;

          // Chart.js
          new Chart(document.getElementById('resultsChart'), {
            type: 'bar',
            data: {
              labels: results.map(r => r.text),
              datasets: [{
                label: 'Votes',
                data: results.map(r => r.votes),
                backgroundColor: results.map((_, i) =>
                  ['#4f46e5','#7c3aed','#10b981','#f59e0b','#ef4444'][i % 5]
                ),
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
            }
          });
          return;
        }
      }

      document.getElementById('ballotContent').innerHTML = html;
    }

    function selectOption(id, text) {
      selectedOptionId   = id;
      selectedOptionText = text;
    }

    function submitVote() {
      if (!selectedOptionId) {
        document.getElementById('voteMsg').innerText = 'Please select an option';
        return;
      }
      document.getElementById('confirmOption').innerText = selectedOptionText;
      new bootstrap.Modal(document.getElementById('confirmModal')).show();
    }

    document.getElementById('confirmVoteBtn').addEventListener('click', async () => {
      const res = await apiCastVote(ballotId, selectedOptionId);
      bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
      if (res.success) {
        loadBallot();
      } else if (res.code === 409) {
        document.getElementById('voteMsg').innerText = 'You have already voted on this ballot';
      } else {
        document.getElementById('voteMsg').innerText = res.error || 'Vote failed';
      }
    });

    async function changeStatus(action) {
      const res = action === 'open' ? await apiOpenBallot(ballotId) : await apiCloseBallot(ballotId);
      if (res.success) loadBallot(); else alert(res.error);
    }

    async function exportCSV() {
      const res = await apiGetBallotResults(ballotId);
      if (!res.success) { alert(res.error); return; }
      const { ballot, results, total_votes, turnout_percent } = res.data;
      const rows = [
        ['Option', 'Votes', 'Percentage'],
        ...results.map(r => [r.text, r.votes, r.percentage + '%']),
        [],
        ['Total Votes', total_votes, ''],
        ['Turnout', turnout_percent + '%', '']
      ];
      const csv  = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `${ballot.title.replace(/\s+/g,'_')}_results.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    loadBallot();
  </script>
</body>
</html>
