<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Meetings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <style>
    .meeting-card { background:var(--bg-surface); border-radius:14px; padding:20px 24px; border:1px solid var(--border); margin-bottom:14px; transition:box-shadow .2s; }
    .meeting-card:hover { box-shadow:0 4px 20px rgba(79,70,229,.1); }
    .minutes-area { width:100%; border:1.5px solid var(--border); border-radius:10px; padding:12px; font-family:'Poppins',sans-serif; font-size:13px; resize:vertical; min-height:160px; outline:none; }
    .minutes-area:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.08); }
    .filter-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .filter-tab { padding:6px 16px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg-surface); font-size:12px; font-weight:600; cursor:pointer; color:var(--text-muted); transition:all .15s; }
    .filter-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <div class="nav-section">Main</div>
      <a href="/frontend/dashboard.html"     class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
      <div class="nav-section">Management</div>
      <a href="/frontend/members.html"       class="nav-item admin-only"><i class="bi bi-people nav-icon"></i> Members</a>
      <a href="/frontend/documents.html"     class="nav-item"><i class="bi bi-folder nav-icon"></i> Documents</a>
      <a href="/frontend/voting.html"        class="nav-item"><i class="bi bi-check2-square nav-icon"></i> Voting</a>
      <a href="/frontend/meetings.html"      class="nav-item"><i class="bi bi-calendar-event nav-icon"></i> Meetings</a>
      <a href="/frontend/calendar.html"      class="nav-item"><i class="bi bi-calendar3 nav-icon"></i> Calendar</a>
      <div class="nav-section">Communication</div>
      <a href="/frontend/notifications.html" class="nav-item"><i class="bi bi-bell nav-icon"></i> Notifications</a>
      <a href="/frontend/chat.html"          class="nav-item"><i class="bi bi-chat-dots nav-icon"></i> Chat</a>
      <div class="nav-section">Finance</div>
      <a href="/frontend/finances.html"      class="nav-item"><i class="bi bi-wallet2 nav-icon"></i> Finances</a>
      <a href="/frontend/analytics.html"     class="nav-item admin-only"><i class="bi bi-bar-chart nav-icon"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/frontend/profile.html" class="nav-item"><i class="bi bi-person-circle nav-icon"></i> Profile</a>
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>


  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h1>Meetings</h1>
      <button class="btn btn-primary btn-sm admin-only" style="display:none"
              data-bs-toggle="modal" data-bs-target="#scheduleMeetingModal">+ Schedule Meeting</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('',this)">All</button>
      <button class="filter-tab" onclick="setFilter('scheduled',this)">Scheduled</button>
      <button class="filter-tab" onclick="setFilter('completed',this)">Completed</button>
      <button class="filter-tab" onclick="setFilter('archived',this)">Archived</button>
    </div>

    <div id="meetingsContainer">
      <p class="text-muted">Loading meetings…</p>
    </div>
  </div>

  <!-- Schedule Meeting Modal -->
  <div class="modal fade" id="scheduleMeetingModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Schedule Meeting</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input id="mTitle" class="form-control" placeholder="Meeting title">
          </div>
          <div class="mb-3">
            <label class="form-label">Date & Time</label>
            <input id="mDate" type="datetime-local" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input id="mLocation" class="form-control" placeholder="Room / Zoom link">
          </div>
          <div class="mb-3">
            <label class="form-label">Agenda</label>
            <textarea id="mAgenda" class="form-control" rows="3"></textarea>
          </div>
          <p id="scheduleMsg" class="text-danger" style="font-size:13px"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="scheduleMeeting()">Schedule</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Meeting Detail Modal -->
  <div class="modal fade" id="meetingDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle">Meeting Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row mb-3">
            <div class="col-6">
              <small class="text-muted d-block">DATE & TIME</small>
              <span id="detailDate" style="font-size:14px"></span>
            </div>
            <div class="col-6">
              <small class="text-muted d-block">LOCATION</small>
              <span id="detailLocation" style="font-size:14px"></span>
            </div>
          </div>
          <div class="mb-3">
            <small class="text-muted d-block mb-1">AGENDA</small>
            <p id="detailAgenda" style="font-size:13px;white-space:pre-wrap;color:#334155"></p>
          </div>
          <div id="minutesSection">
            <small class="text-muted d-block mb-1">MINUTES</small>
            <textarea id="minutesArea" class="minutes-area" placeholder="Enter meeting minutes here…"></textarea>
            <button class="btn btn-outline-primary btn-sm mt-2 admin-only" id="saveMinutesBtn" style="display:none" onclick="saveMinutes()">Save Minutes</button>
          </div>
          <p id="detailMsg" class="text-success mt-2" style="font-size:13px"></p>
        </div>
        <div class="modal-footer flex-wrap gap-2">
          <div class="me-auto admin-only d-flex gap-2 flex-wrap" id="adminDetailBtns" style="display:none">
            <button class="btn btn-sm btn-outline-success"   id="inviteBtn"   onclick="sendInvites()">Send Invitations</button>
            <button class="btn btn-sm btn-outline-primary"   id="completeBtn" onclick="completeM()">Mark Complete</button>
            <button class="btn btn-sm btn-outline-secondary" id="archiveBtn"  onclick="archiveM()">Archive</button>
            <button class="btn btn-sm btn-outline-danger"                     onclick="deleteM()">Delete</button>
          </div>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    const STATUS_COLORS = { scheduled: 'primary', completed: 'success', archived: 'secondary' };
    let currentFilter  = '';
    let activeMeetingId = null;

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      loadMeetings();
    }

    async function loadMeetings() {
      const res = await apiGetMeetings(1, 50, currentFilter);
      const container = document.getElementById('meetingsContainer');
      if (!res.success || !res.data.meetings.length) {
        container.innerHTML = '<div class="card"><p class="text-muted text-center py-4">No meetings found.</p></div>';
        return;
      }
      const isAdmin = getRole() === 'admin';
      container.innerHTML = res.data.meetings.map(m => `
        <div class="meeting-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5 style="font-size:15px;font-weight:600;margin-bottom:4px">${m.title}</h5>
              <p class="text-muted mb-0" style="font-size:13px">
                📅 ${new Date(m.scheduled_at).toLocaleString()}
                ${m.location ? ` &nbsp;📍 ${m.location}` : ''}
              </p>
            </div>
            <span class="badge bg-${STATUS_COLORS[m.status] || 'secondary'}">${m.status}</span>
          </div>
          ${m.agenda ? `<p class="mt-2 mb-0" style="font-size:12px;color:var(--text-muted);white-space:pre-wrap">${m.agenda.slice(0,120)}${m.agenda.length > 120 ? '…' : ''}</p>` : ''}
          <div class="mt-3">
            <button class="btn btn-sm btn-outline-primary" onclick="openDetail('${m.id}')">View Details</button>
          </div>
        </div>
      `).join('');
    }

    async function openDetail(id) {
      activeMeetingId = id;
      const res = await apiGetMeeting(id);
      if (!res.success) { alert(res.error); return; }
      const m = res.data.meeting;
      const isAdmin = getRole() === 'admin';

      document.getElementById('detailTitle').innerText    = m.title;
      document.getElementById('detailDate').innerText     = new Date(m.scheduled_at).toLocaleString();
      document.getElementById('detailLocation').innerText = m.location || '—';
      document.getElementById('detailAgenda').innerText   = m.agenda   || '—';
      document.getElementById('minutesArea').value        = m.minutes  || '';
      document.getElementById('detailMsg').innerText      = '';

      if (isAdmin) {
        document.getElementById('adminDetailBtns').style.display = 'flex';
        document.getElementById('saveMinutesBtn').style.display  = 'inline-block';
        // Disable complete/archive based on status
        document.getElementById('completeBtn').disabled = m.status !== 'scheduled';
        document.getElementById('archiveBtn').disabled  = m.status === 'archived';
      }

      new bootstrap.Modal(document.getElementById('meetingDetailModal')).show();
    }

    async function scheduleMeeting() {
      const msg = document.getElementById('scheduleMsg');
      const res = await apiCreateMeeting({
        title:        document.getElementById('mTitle').value.trim(),
        scheduled_at: document.getElementById('mDate').value,
        location:     document.getElementById('mLocation').value.trim(),
        agenda:       document.getElementById('mAgenda').value.trim()
      });
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('scheduleMeetingModal')).hide();
        loadMeetings();
      } else {
        msg.innerText = res.error || 'Failed to schedule meeting';
      }
    }

    async function saveMinutes() {
      const minutes = document.getElementById('minutesArea').value;
      const res     = await apiSaveMinutes(activeMeetingId, minutes);
      const msg     = document.getElementById('detailMsg');
      if (res.success) {
        msg.innerText      = 'Minutes saved successfully';
        msg.className      = 'text-success mt-2';
        setTimeout(() => msg.innerText = '', 3000);
      } else {
        msg.innerText = res.error || 'Save failed';
        msg.className = 'text-danger mt-2';
      }
    }

    async function sendInvites() {
      // Get all active members
      const usersRes = await apiGetUsers(1, 100);
      if (!usersRes.success) { alert('Could not load members'); return; }

      const emails = usersRes.data.users
        .filter(u => u.is_active)
        .map(u => u.email)
        .join(',');

      const title    = document.getElementById('detailTitle').innerText;
      const date     = document.getElementById('detailDate').innerText;
      const location = document.getElementById('detailLocation').innerText;
      const agenda   = document.getElementById('detailAgenda').innerText;

      const subject = encodeURIComponent(`Meeting Invitation: ${title}`);
      const body    = encodeURIComponent(
        `You are invited to the following meeting:\n\n` +
        `Title:    ${title}\n` +
        `Date:     ${date}\n` +
        `Location: ${location}\n\n` +
        `Agenda:\n${agenda}\n\n` +
        `Please make every effort to attend.\n\nIDMS System`
      );

      window.location.href = `mailto:${emails}?subject=${subject}&body=${body}`;

      document.getElementById('detailMsg').innerText = `Opening email with ${usersRes.data.users.length} recipients…`;
      document.getElementById('detailMsg').className = 'text-success mt-2';
    }

    async function deleteM() {
      if (!confirm('Delete this meeting permanently?')) return;
      const res = await apiDeleteMeeting(activeMeetingId);
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('meetingDetailModal')).hide();
        loadMeetings();
      } else { alert(res.error); }
    }

    async function completeM() {
      const res = await apiCompleteMeeting(activeMeetingId);
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('meetingDetailModal')).hide();
        loadMeetings();
      } else { alert(res.error); }
    }

    async function archiveM() {
      if (!confirm('Archive this meeting?')) return;
      const res = await apiArchiveMeeting(activeMeetingId);
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('meetingDetailModal')).hide();
        loadMeetings();
      } else { alert(res.error); }
    }

    loadMeetings();
  </script>
</body>
</html>
