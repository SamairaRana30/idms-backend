<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IDMS | Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-body">

            <!-- VIEW MODE -->
            <div id="viewProfile">
                <h4 id="fullName">Loading...</h4>
                <p class="text-muted" id="role"></p>

                <p><strong>Email:</strong> <span id="email"></span></p>
                <p><strong>Phone:</strong> <span id="phone"></span></p>
                <p><strong>Address:</strong> <span id="address"></span></p>
                <p><strong>Joined:</strong> <span id="joinDate"></span></p>

                <button class="btn btn-primary btn-sm mt-2" onclick="enableEdit()">Edit Profile</button>
            </div>

            <!-- EDIT MODE -->
            <div id="editProfile" style="display:none;">
                <h5>Edit Profile</h5>

                <input id="editName" class="form-control mb-2" placeholder="Full Name">
                <input id="editEmail" class="form-control mb-2" placeholder="Email">
                <input id="editPhone" class="form-control mb-2" placeholder="Phone">
                <input id="editAddress" class="form-control mb-2" placeholder="Address">

                <button class="btn btn-success btn-sm" onclick="saveProfile()">Save</button>
                <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">Cancel</button>

                <div id="message" class="mt-2 text-danger"></div>
            </div>

        </div>
    </div>
</div>

<script src="/frontend/js/profile.js"></script>
</body>
</html>
