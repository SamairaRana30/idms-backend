<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f0fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(79,70,229,.10);
      width: 100%;
      max-width: 460px;
      padding: 40px 36px;
    }
    .brand-header { text-align: center; margin-bottom: 28px; }
    .brand-logo   { font-size: 30px; font-weight: 700; color: #4f46e5; letter-spacing: 3px; }
    .brand-sub    { font-size: 13px; color: #888; margin-top: 4px; }
    .nav-tabs .nav-link            { color: #666; font-weight: 500; border-radius: 0; }
    .nav-tabs .nav-link.active     { color: #4f46e5; border-color: #dee2e6 #dee2e6 #fff; font-weight: 600; }
    .nav-tabs .nav-link:hover:not(.active) { color: #4f46e5; }
    .btn-primary {
      background: #4f46e5;
      border-color: #4f46e5;
      font-weight: 500;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
    }
    .btn-primary:hover { background: #4338ca; border-color: #4338ca; }
    .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 .2rem rgba(79,70,229,.15); }
    label { font-size: 13px; font-weight: 500; color: #444; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">IDMS</div>
      <div class="brand-sub">Identity Management System</div>
    </div>

    <ul class="nav nav-tabs mb-4" id="authTabs">
      <li class="nav-item flex-fill text-center">
        <button class="nav-link active w-100" data-bs-toggle="tab" data-bs-target="#loginTab">Sign In</button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" data-bs-toggle="tab" data-bs-target="#registerTab">Register</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- Login Tab -->
      <div class="tab-pane fade show active" id="loginTab">
        <div id="loginAlert" class="alert d-none" role="alert"></div>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail">Email address</label>
            <input id="loginEmail" type="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" class="form-control" placeholder="Enter your password" required>
          </div>
          <button class="btn btn-primary mt-1" type="submit">Sign In</button>
        </form>
      </div>

      <!-- Register Tab -->
      <div class="tab-pane fade" id="registerTab">
        <div id="registerAlert" class="alert d-none" role="alert"></div>
        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="regName">Full Name</label>
            <input id="regName" type="text" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="mb-3">
            <label for="regEmail">Email address</label>
            <input id="regEmail" type="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label for="regPassword">Password</label>
            <input id="regPassword" type="password" class="form-control" placeholder="Min. 8 characters" required>
          </div>
          <div class="mb-3">
            <label for="regConfirm">Confirm Password</label>
            <input id="regConfirm" type="password" class="form-control" placeholder="Repeat your password" required>
          </div>
          <button class="btn btn-primary mt-1" type="submit">Create Account</button>
        </form>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Already logged in → go to dashboard
    if (localStorage.getItem('token')) {
      window.location.href = '/frontend/dashboard.html';
    }

    function showAlert(id, type, msg) {
      const el = document.getElementById(id);
      el.className = `alert alert-${type}`;
      el.innerText = msg;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        return showAlert('loginAlert', 'danger', 'Email and password are required');
      }

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        }).then(r => r.json());

        if (res.success) {
          const { token, user } = res.data;
          localStorage.setItem('token',     token);
          localStorage.setItem('userName',  user.full_name);
          localStorage.setItem('userEmail', user.email);
          localStorage.setItem('role',      user.role);
          localStorage.setItem('userId',    user.id);
          showAlert('loginAlert', 'success', 'Login successful! Redirecting...');
          setTimeout(() => { window.location.href = '/frontend/dashboard.html'; }, 800);
        } else {
          showAlert('loginAlert', 'danger', res.error || 'Invalid email or password');
        }
      } catch {
        showAlert('loginAlert', 'danger', 'Server error. Please try again.');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const full_name = document.getElementById('regName').value.trim();
      const email     = document.getElementById('regEmail').value.trim();
      const password  = document.getElementById('regPassword').value;
      const confirm   = document.getElementById('regConfirm').value;

      if (!full_name || !email || !password || !confirm) {
        return showAlert('registerAlert', 'danger', 'All fields are required');
      }
      if (password.length < 8) {
        return showAlert('registerAlert', 'danger', 'Password must be at least 8 characters');
      }
      if (password !== confirm) {
        return showAlert('registerAlert', 'danger', 'Passwords do not match');
      }

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, password })
        }).then(r => r.json());

        if (res.success) {
          showAlert('registerAlert', 'success', 'Account created! Switching to sign in...');
          setTimeout(() => {
            document.querySelector('[data-bs-target="#loginTab"]').click();
            document.getElementById('loginEmail').value = email;
          }, 1200);
        } else {
          showAlert('registerAlert', 'danger', res.error || 'Registration failed');
        }
      } catch {
        showAlert('registerAlert', 'danger', 'Server error. Please try again.');
      }
    });
  </script>
</body>
</html>
