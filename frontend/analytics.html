<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <a href="/frontend/dashboard.html"      class="nav-item">Dashboard</a>
      <a href="/frontend/members.html"        class="nav-item admin-only">Members</a>
      <a href="/frontend/documents.html"      class="nav-item">Documents</a>
      <a href="/frontend/voting.html"         class="nav-item">Voting</a>
      <a href="/frontend/meetings.html"       class="nav-item">Meetings</a>
      <a href="/frontend/finances.html"       class="nav-item">Finances</a>
      <a href="/frontend/notifications.html"  class="nav-item">Notifications</a>
      <a href="/frontend/analytics.html"      class="nav-item admin-only">Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h1>Chat Analytics</h1>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#analyticsModal">
        + Upload Report
      </button>
    </div>

    <div id="latestStats" class="stats-grid" style="display:none">
      <div class="stat-card">
        <div class="stat-label">Total Messages</div>
        <div class="stat-value" id="statMessages">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Users</div>
        <div class="stat-value" id="statUsers">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sentiment Score</div>
        <div class="stat-value" id="statSentiment">—</div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Upload History</h2>
      <table class="users-table">
        <thead>
          <tr><th>Date</th><th>Messages</th><th>Active Users</th><th>Peak Hour</th><th>Sentiment</th><th>Text</th><th>Media</th><th>Uploaded By</th></tr>
        </thead>
        <tbody id="analyticsTableBody">
          <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal fade" id="analyticsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Upload Analytics Report</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label">Upload Date</label>
              <input id="aDate" type="date" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">Total Messages</label>
              <input id="aMessages" type="number" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">Active Users</label>
              <input id="aUsers" type="number" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">Peak Hour (0–23)</label>
              <input id="aPeak" type="number" min="0" max="23" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">Sentiment Score</label>
              <input id="aSentiment" type="number" step="0.01" class="form-control" placeholder="-1 to 1">
            </div>
            <div class="col-6">
              <label class="form-label">Text Messages</label>
              <input id="aText" type="number" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Media Messages</label>
              <input id="aMedia" type="number" class="form-control">
            </div>
          </div>
          <p id="analyticsMsg" class="text-danger mt-2"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="uploadAnalytics()">Upload</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    async function loadAnalytics() {
      const res = await apiGetAnalytics();
      const tbody = document.getElementById('analyticsTableBody');
      if (!res.success || !res.data.analytics.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No analytics uploaded yet</td></tr>';
        return;
      }

      const latest = res.data.analytics[0];
      document.getElementById('latestStats').style.display = 'grid';
      document.getElementById('statMessages').innerText  = latest.total_messages;
      document.getElementById('statUsers').innerText     = latest.active_users;
      document.getElementById('statSentiment').innerText = parseFloat(latest.sentiment_score).toFixed(2);

      tbody.innerHTML = res.data.analytics.map(a => `
        <tr>
          <td>${new Date(a.upload_date).toLocaleDateString()}</td>
          <td>${a.total_messages}</td>
          <td>${a.active_users}</td>
          <td>${a.peak_hour}:00</td>
          <td>${parseFloat(a.sentiment_score).toFixed(2)}</td>
          <td>${a.text_count}</td>
          <td>${a.media_count}</td>
          <td>${a.uploaded_by_name}</td>
        </tr>
      `).join('');
    }

    async function uploadAnalytics() {
      const data = await apiUploadAnalytics({
        upload_date:     document.getElementById('aDate').value,
        total_messages:  parseInt(document.getElementById('aMessages').value),
        active_users:    parseInt(document.getElementById('aUsers').value),
        peak_hour:       parseInt(document.getElementById('aPeak').value),
        sentiment_score: parseFloat(document.getElementById('aSentiment').value),
        text_count:      parseInt(document.getElementById('aText').value),
        media_count:     parseInt(document.getElementById('aMedia').value)
      });
      if (data.success) {
        bootstrap.Modal.getInstance(document.getElementById('analyticsModal')).hide();
        loadAnalytics();
      } else {
        document.getElementById('analyticsMsg').innerText = data.error;
      }
    }

    loadAnalytics();
  </script>
</body>
</html>
