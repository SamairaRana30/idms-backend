<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Voting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <style>
    .ballot-card { background:var(--bg-surface); border-radius:14px; padding:22px 24px; border:1px solid var(--border); margin-bottom:16px; transition:box-shadow .2s; }
    .ballot-card:hover { box-shadow:0 4px 20px rgba(79,70,229,.1); }
    .ballot-status { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
    .status-draft   { background:var(--bg-hover); color:var(--text-muted); }
    .status-open    { background:var(--success-bg); color:var(--success); }
    .status-closed  { background:var(--danger-bg); color:var(--danger); }
    .option-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .option-row input[type=text] { flex:1; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <div class="nav-section">Main</div>
      <a href="/frontend/dashboard.html"     class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
      <div class="nav-section">Management</div>
      <a href="/frontend/members.html"       class="nav-item admin-only"><i class="bi bi-people nav-icon"></i> Members</a>
      <a href="/frontend/documents.html"     class="nav-item"><i class="bi bi-folder nav-icon"></i> Documents</a>
      <a href="/frontend/voting.html"        class="nav-item"><i class="bi bi-check2-square nav-icon"></i> Voting</a>
      <a href="/frontend/meetings.html"      class="nav-item"><i class="bi bi-calendar-event nav-icon"></i> Meetings</a>
      <a href="/frontend/calendar.html"      class="nav-item"><i class="bi bi-calendar3 nav-icon"></i> Calendar</a>
      <div class="nav-section">Communication</div>
      <a href="/frontend/notifications.html" class="nav-item"><i class="bi bi-bell nav-icon"></i> Notifications</a>
      <a href="/frontend/chat.html"          class="nav-item"><i class="bi bi-chat-dots nav-icon"></i> Chat</a>
      <div class="nav-section">Finance</div>
      <a href="/frontend/finances.html"      class="nav-item"><i class="bi bi-wallet2 nav-icon"></i> Finances</a>
      <a href="/frontend/analytics.html"     class="nav-item admin-only"><i class="bi bi-bar-chart nav-icon"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/frontend/profile.html" class="nav-item"><i class="bi bi-person-circle nav-icon"></i> Profile</a>
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>


  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h1>Voting</h1>
      <button class="btn btn-primary btn-sm admin-only" style="display:none"
              data-bs-toggle="modal" data-bs-target="#ballotModal">+ Create Ballot</button>
    </div>

    <div id="ballotsContainer">
      <p class="text-muted">Loading ballots…</p>
    </div>
  </div>

  <!-- Create Ballot Modal -->
  <div class="modal fade" id="ballotModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create Ballot</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input id="bTitle" class="form-control" placeholder="Ballot title">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="bDesc" class="form-control" rows="2"></textarea>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label">Start Date</label>
              <input id="bStart" type="datetime-local" class="form-control">
            </div>
            <div class="col-6">
              <label class="form-label">End Date</label>
              <input id="bEnd" type="datetime-local" class="form-control">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Options</label>
            <div id="optionsContainer">
              <div class="option-row">
                <input type="text" class="form-control ballot-option" placeholder="Option 1">
                <button class="btn btn-outline-danger btn-sm" onclick="removeOption(this)">✕</button>
              </div>
              <div class="option-row">
                <input type="text" class="form-control ballot-option" placeholder="Option 2">
                <button class="btn btn-outline-danger btn-sm" onclick="removeOption(this)">✕</button>
              </div>
            </div>
            <button class="btn btn-outline-secondary btn-sm mt-2" onclick="addOption()">+ Add Option</button>
          </div>
          <p id="ballotMsg" class="text-danger mt-2" style="font-size:13px"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="createBallot()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    async function loadBallots() {
      const res = await apiGetBallots();
      const container = document.getElementById('ballotsContainer');
      if (!res.success || !res.data.ballots.length) {
        container.innerHTML = '<div class="card"><p class="text-muted text-center py-4">No ballots available yet.</p></div>';
        return;
      }
      const isAdmin = getRole() === 'admin';
      container.innerHTML = res.data.ballots.map(b => `
        <div class="ballot-card">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <h5 class="mb-1" style="font-size:15px;font-weight:600">${b.title}</h5>
              <p class="text-muted mb-0" style="font-size:13px">${b.description || ''}</p>
            </div>
            <span class="ballot-status status-${b.status}">${b.status.toUpperCase()}</span>
          </div>
          <div class="d-flex gap-2 mt-3 flex-wrap">
            <a href="/frontend/voting-detail.html?id=${b.id}" class="btn btn-sm btn-outline-primary">
              ${b.status === 'open' ? 'Vote Now' : 'View Details'}
            </a>
            ${isAdmin ? `
              ${b.status === 'draft'  ? `<button class="btn btn-sm btn-success" onclick="openBallot('${b.id}')">Publish</button>` : ''}
              ${b.status === 'open'   ? `<button class="btn btn-sm btn-warning" onclick="closeBallot('${b.id}')">Close</button>` : ''}
              ${b.status === 'closed' ? `<a href="/frontend/voting-detail.html?id=${b.id}&results=1" class="btn btn-sm btn-outline-secondary">Results</a>` : ''}
              <button class="btn btn-sm btn-outline-danger" onclick="deleteBallot('${b.id}')">Delete</button>
            ` : ''}
          </div>
          ${b.start_date ? `<small class="text-muted d-block mt-2">${new Date(b.start_date).toLocaleDateString()} – ${b.end_date ? new Date(b.end_date).toLocaleDateString() : 'No end date'}</small>` : ''}
        </div>
      `).join('');
    }

    // ── Options ───────────────────────────────────────────────────────────────
    let optCount = 2;
    function addOption() {
      optCount++;
      const div = document.createElement('div');
      div.className = 'option-row';
      div.innerHTML = `<input type="text" class="form-control ballot-option" placeholder="Option ${optCount}">
                       <button class="btn btn-outline-danger btn-sm" onclick="removeOption(this)">✕</button>`;
      document.getElementById('optionsContainer').appendChild(div);
    }
    function removeOption(btn) {
      const rows = document.querySelectorAll('.option-row');
      if (rows.length <= 2) return;
      btn.closest('.option-row').remove();
    }

    // ── Create ────────────────────────────────────────────────────────────────
    async function createBallot() {
      const msg     = document.getElementById('ballotMsg');
      const options = [...document.querySelectorAll('.ballot-option')]
                        .map(i => i.value.trim()).filter(Boolean);
      msg.innerText = '';
      if (options.length < 2) { msg.innerText = 'At least 2 options required'; return; }

      const res = await apiCreateBallot({
        title:       document.getElementById('bTitle').value.trim(),
        description: document.getElementById('bDesc').value.trim(),
        start_date:  document.getElementById('bStart').value || null,
        end_date:    document.getElementById('bEnd').value   || null,
        options
      });
      if (res.success) {
        bootstrap.Modal.getInstance(document.getElementById('ballotModal')).hide();
        loadBallots();
      } else {
        msg.innerText = res.error || 'Failed to create ballot';
      }
    }

    async function deleteBallot(id) {
      if (!confirm('Delete this ballot and all its votes? This cannot be undone.')) return;
      const res = await apiDeleteBallot(id);
      if (res.success) loadBallots(); else alert(res.error);
    }

    async function openBallot(id) {
      const res = await apiOpenBallot(id);
      if (res.success) loadBallots(); else alert(res.error);
    }
    async function closeBallot(id) {
      if (!confirm('Close this ballot? Voting will end.')) return;
      const res = await apiCloseBallot(id);
      if (res.success) loadBallots(); else alert(res.error);
    }

    loadBallots();
  </script>
</body>
</html>
