<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <style>
    .chat-layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; height: calc(100vh - 120px); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .channel-list { background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .channel-list-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .channel-list-header h6 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 0; }
    .channel-item { padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent; transition: background .15s; }
    .channel-item:hover { background: var(--bg-hover); }
    .channel-item.active { background: var(--accent-bg); border-left-color: var(--accent); }
    .channel-name { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
    .channel-item.active .channel-name { color: #38bdf8; }
    .channel-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .chat-area { display: flex; flex-direction: column; background: var(--bg-base); }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--bg-surface); display: flex; align-items: center; gap: 10px; }
    .chat-header h5 { font-size: 15px; font-weight: 600; color: var(--text-primary); margin: 0; }
    .chat-header small { color: var(--text-muted); font-size: 12px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 2px; }
    .msg-group { margin-bottom: 16px; }
    .msg-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
    .msg-author { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .msg-time { font-size: 11px; color: var(--text-muted); }
    .msg-bubble { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 2px 12px 12px 12px; padding: 10px 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; max-width: 680px; display: inline-block; }
    .msg-bubble.own { background: var(--accent-bg); border-color: rgba(14,165,233,0.2); color: var(--text-primary); border-radius: 12px 2px 12px 12px; }
    .msg-own { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 16px; }
    .msg-own .msg-header { flex-direction: row-reverse; }
    .msg-own .msg-author { color: #38bdf8; }
    .reply-preview { background: var(--bg-elevated); border-left: 2px solid var(--accent); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 11px; color: var(--text-muted); max-width: 680px; }
    .chat-input-area { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--bg-surface); }
    .chat-input-wrap { display: flex; gap: 10px; align-items: flex-end; }
    .chat-input-wrap textarea {
      flex: 1; background: var(--bg-elevated); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); color: var(--text-primary); padding: 10px 14px;
      font-size: 13px; font-family: "Poppins", sans-serif; resize: none; outline: none;
      max-height: 120px; line-height: 1.5; transition: border-color .2s;
    }
    .chat-input-wrap textarea:focus { border-color: var(--accent); }
    .chat-input-wrap textarea::placeholder { color: var(--text-muted); }
    .send-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: background .2s; }
    .send-btn:hover { background: var(--accent-dim); }
    .new-channel-btn { width: 28px; height: 28px; border-radius: 6px; background: var(--accent-bg); border: 1px solid rgba(14,165,233,0.2); color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: background .2s; }
    .new-channel-btn:hover { background: var(--accent); color: #fff; }
    .empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--text-muted); }
    .empty-chat i { font-size: 48px; opacity: .2; }
    @media(max-width:768px){ .chat-layout{grid-template-columns:1fr;height:auto} .channel-list{max-height:200px} }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <div class="nav-section">Main</div>
      <a href="/frontend/dashboard.html"     class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
      <div class="nav-section">Management</div>
      <a href="/frontend/members.html"       class="nav-item admin-only"><i class="bi bi-people nav-icon"></i> Members</a>
      <a href="/frontend/documents.html"     class="nav-item"><i class="bi bi-folder nav-icon"></i> Documents</a>
      <a href="/frontend/voting.html"        class="nav-item"><i class="bi bi-check2-square nav-icon"></i> Voting</a>
      <a href="/frontend/meetings.html"      class="nav-item"><i class="bi bi-calendar-event nav-icon"></i> Meetings</a>
      <a href="/frontend/calendar.html"      class="nav-item"><i class="bi bi-calendar3 nav-icon"></i> Calendar</a>
      <div class="nav-section">Communication</div>
      <a href="/frontend/notifications.html" class="nav-item"><i class="bi bi-bell nav-icon"></i> Notifications</a>
      <a href="/frontend/chat.html"          class="nav-item active"><i class="bi bi-chat-dots nav-icon"></i> Chat</a>
      <div class="nav-section">Finance</div>
      <a href="/frontend/finances.html"      class="nav-item"><i class="bi bi-wallet2 nav-icon"></i> Finances</a>
      <a href="/frontend/analytics.html"     class="nav-item admin-only"><i class="bi bi-bar-chart nav-icon"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/frontend/profile.html" class="nav-item"><i class="bi bi-person-circle nav-icon"></i> Profile</a>
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <div class="page-header">
      <h1>Chat</h1>
    </div>

    <div class="chat-layout">
      <!-- Channel list -->
      <div class="channel-list">
        <div class="channel-list-header">
          <h6>Channels</h6>
          <button class="new-channel-btn admin-only" onclick="showNewChannelModal()" title="New channel"><i class="bi bi-plus"></i></button>
        </div>
        <div id="channelList" style="flex:1;overflow-y:auto">
          <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">Loading…</div>
        </div>
      </div>

      <!-- Chat area -->
      <div class="chat-area" id="chatArea">
        <div class="empty-chat">
          <i class="bi bi-chat-dots"></i>
          <p>Select a channel to start messaging</p>
        </div>
      </div>
    </div>
  </div>

  <!-- New Channel Modal -->
  <div class="modal fade" id="newChannelModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">New Channel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Channel Name</label>
            <input id="newChannelName" class="form-control" placeholder="e.g. general, announcements">
          </div>
          <div class="mb-3">
            <label class="form-label">Description (optional)</label>
            <input id="newChannelDesc" class="form-control" placeholder="What is this channel for?">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary btn-sm" onclick="createChannel()">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script src="/frontend/js/chat.js"></script>
</body>
</html>
