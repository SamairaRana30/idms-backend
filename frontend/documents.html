<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <a href="/frontend/dashboard.html"      class="nav-item">Dashboard</a>
      <a href="/frontend/members.html"        class="nav-item admin-only">Members</a>
      <a href="/frontend/documents.html"      class="nav-item">Documents</a>
      <a href="/frontend/voting.html"         class="nav-item">Voting</a>
      <a href="/frontend/meetings.html"       class="nav-item">Meetings</a>
      <a href="/frontend/finances.html"       class="nav-item">Finances</a>
      <a href="/frontend/notifications.html"  class="nav-item">Notifications</a>
      <a href="/frontend/analytics.html"      class="nav-item admin-only">Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h1>Documents</h1>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#uploadModal">
        + Upload Document
      </button>
    </div>

    <div class="card">
      <h2 class="card-title">Document Library</h2>
      <table class="users-table">
        <thead>
          <tr><th>Title</th><th>Type</th><th>Category</th><th>Visibility</th><th>Uploaded By</th><th>Date</th><th></th></tr>
        </thead>
        <tbody id="docsTableBody">
          <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Upload Document</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input id="docTitle" class="form-control" placeholder="Document title">
          </div>
          <div class="mb-3">
            <label class="form-label">File Path (Supabase Storage URL)</label>
            <input id="docPath" class="form-control" placeholder="documents/filename.pdf">
          </div>
          <div class="mb-3">
            <label class="form-label">File Type</label>
            <input id="docType" class="form-control" placeholder="pdf, docx, xlsx...">
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input id="docCategory" class="form-control" placeholder="Minutes, Reports, Policy...">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="docPublic">
            <label class="form-check-label">Make public (visible to all members)</label>
          </div>
          <p id="uploadMsg" class="text-danger"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="uploadDoc()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    async function loadDocs() {
      const res = await apiGetDocuments();
      const tbody = document.getElementById('docsTableBody');
      if (!res.success || !res.data.documents.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No documents yet</td></tr>`;
        return;
      }
      tbody.innerHTML = res.data.documents.map(d => `
        <tr>
          <td><strong>${d.title}</strong></td>
          <td><span class="badge bg-secondary">${d.file_type || '—'}</span></td>
          <td>${d.category || '—'}</td>
          <td><span class="badge ${d.is_public ? 'badge-active' : 'badge-inactive'}">${d.is_public ? 'Public' : 'Private'}</span></td>
          <td>${d.uploaded_by_name}</td>
          <td>${new Date(d.created_at).toLocaleDateString()}</td>
          <td>
            <a href="${d.file_path}" target="_blank" class="btn btn-sm btn-outline-primary">View</a>
            <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteDoc('${d.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function uploadDoc() {
      const msg = document.getElementById('uploadMsg');
      const data = await apiCreateDocument({
        title:     document.getElementById('docTitle').value.trim(),
        file_path: document.getElementById('docPath').value.trim(),
        file_type: document.getElementById('docType').value.trim(),
        category:  document.getElementById('docCategory').value.trim(),
        is_public: document.getElementById('docPublic').checked
      });
      if (data.success) {
        bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
        loadDocs();
      } else {
        msg.innerText = data.error;
      }
    }

    async function deleteDoc(id) {
      if (!confirm('Delete this document?')) return;
      const data = await apiDeleteDocument(id);
      if (data.success) loadDocs();
      else alert(data.error);
    }

    loadDocs();
  </script>
</body>
</html>
