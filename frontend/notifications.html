<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <a href="/frontend/dashboard.html"      class="nav-item">Dashboard</a>
      <a href="/frontend/members.html"        class="nav-item admin-only">Members</a>
      <a href="/frontend/documents.html"      class="nav-item">Documents</a>
      <a href="/frontend/voting.html"         class="nav-item">Voting</a>
      <a href="/frontend/meetings.html"       class="nav-item">Meetings</a>
      <a href="/frontend/finances.html"       class="nav-item">Finances</a>
      <a href="/frontend/notifications.html"  class="nav-item">Notifications</a>
      <a href="/frontend/analytics.html"      class="nav-item admin-only">Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h1>Notifications</h1>
      <button class="btn btn-primary btn-sm admin-only" style="display:none"
              data-bs-toggle="modal" data-bs-target="#notifModal">+ Send Notification</button>
    </div>
    <div id="notifList"></div>
  </div>

  <!-- Send Notification Modal -->
  <div class="modal fade" id="notifModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Send Notification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select id="notifType" class="form-select">
              <option value="announcement">Announcement</option>
              <option value="reminder">Reminder</option>
              <option value="broadcast">Broadcast</option>
              <option value="targeted">Targeted</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Target Audience</label>
            <select id="notifTarget" class="form-select">
              <option value="all">All</option>
              <option value="admin">Admins Only</option>
              <option value="member">Members Only</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input id="notifTitle" class="form-control" placeholder="Notification title">
          </div>
          <div class="mb-3">
            <label class="form-label">Body</label>
            <textarea id="notifBody" class="form-control" rows="3"></textarea>
          </div>
          <p id="notifMsg" class="text-danger"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="sendNotif()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    const typeIcons = { announcement: '📢', reminder: '⏰', broadcast: '📡', targeted: '🎯' };

    async function loadNotifications() {
      const res = await apiGetNotifications();
      const container = document.getElementById('notifList');
      if (!res.success || !res.data.notifications.length) {
        container.innerHTML = '<div class="card"><p class="text-muted text-center py-3">No notifications yet</p></div>';
        return;
      }
      container.innerHTML = res.data.notifications.map(n => `
        <div class="card mb-3">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <span style="font-size:18px">${typeIcons[n.type] || '🔔'}</span>
              <strong class="ms-2">${n.title}</strong>
              <span class="badge bg-secondary ms-2">${n.type}</span>
              <span class="badge bg-light text-dark ms-1">${n.target_role}</span>
            </div>
            <small class="text-muted">${new Date(n.sent_at).toLocaleString()}</small>
          </div>
          <p class="mt-2 mb-0" style="font-size:14px;color:#444">${n.body}</p>
          <small class="text-muted mt-1">Sent by ${n.sent_by_name}</small>
        </div>
      `).join('');
    }

    async function sendNotif() {
      const data = await apiSendNotification({
        type:        document.getElementById('notifType').value,
        target_role: document.getElementById('notifTarget').value,
        title:       document.getElementById('notifTitle').value.trim(),
        body:        document.getElementById('notifBody').value.trim()
      });
      if (data.success) {
        bootstrap.Modal.getInstance(document.getElementById('notifModal')).hide();
        loadNotifications();
      } else {
        document.getElementById('notifMsg').innerText = data.error;
      }
    }

    loadNotifications();
  </script>
</body>
</html>
