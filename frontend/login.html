<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IDMS | Login</title>
    <link rel="stylesheet" href="/frontend/css/fancy.css">
</head>
<body>

<div class="card">
    <h2>Login</h2>
    <p class="subtitle">Access your account</p>

    <form id="loginForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" class="btn">Login</button>
        <p id="message" class="message"></p>
    </form>

    <div class="link">
        New user?
        <a href="/frontend/register.html">Register</a>
    </div>
</div>

<script src="/frontend/js/login.js"></script>
</body>
</html>
