<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/auth.css">
</head>
<body>
  <div class="brand-panel">
    <div class="brand-content">
      <div class="brand-logo">IDMS</div>
      <h1 class="brand-title">Identity Management System</h1>
      <p class="brand-subtitle">Secure access control and user management for your organisation.</p>
      <div class="brand-features">
        <div class="feature-item">
          <span class="feature-icon">&#10003;</span> Role-based access control
        </div>
        <div class="feature-item">
          <span class="feature-icon">&#10003;</span> Encrypted authentication
        </div>
        <div class="feature-item">
          <span class="feature-icon">&#10003;</span> Real-time user management
        </div>
      </div>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-container">
      <h2 class="form-title">Welcome back</h2>
      <p class="form-subtitle">Sign in to your account to continue</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Email address</label>
          <input id="email" type="email" placeholder="you@example.com">
        </div>

        <div class="input-group">
          <label>Password</label>
          <input id="password" type="password" placeholder="Enter your password">
        </div>

        <button class="btn" type="submit">Sign In</button>
        <p id="message" class="message"></p>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="/frontend/register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="/frontend/js/login.js"></script>
</body>
</html>
