<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDMS | Voting Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/dashboard.css">
  <style>
    .result-option-bar { margin-bottom: 18px; }
    .result-option-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .result-option-name { font-size:14px; font-weight:600; color:var(--text-primary); }
    .result-pct { font-size:14px; font-weight:700; color:var(--accent); }
    .result-track { height:10px; background:var(--bg-elevated); border-radius:20px; overflow:hidden; }
    .result-fill  { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-dim)); border-radius:20px; transition:width .8s ease; }
    .result-votes { font-size:12px; color:var(--text-muted); margin-top:4px; }
    .winner-tag   { background:rgba(245,158,11,.15); color:#fbbf24; font-size:11px; font-weight:700;
                    padding:2px 8px; border-radius:20px; margin-left:8px; }
    .turnout-card { background:rgba(99,102,241,.12); border:1px solid rgba(99,102,241,.25);
                    border-radius:var(--radius); padding:18px 22px; }
    .turnout-label{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
    .turnout-val  { font-size:28px; font-weight:800; color:#a5b4fc; margin-top:2px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">IDMS</div>
    <nav>
      <div class="nav-section">Main</div>
      <a href="/frontend/dashboard.html"     class="nav-item"><i class="bi bi-speedometer2 nav-icon"></i> Dashboard</a>
      <div class="nav-section">Management</div>
      <a href="/frontend/members.html"       class="nav-item admin-only"><i class="bi bi-people nav-icon"></i> Members</a>
      <a href="/frontend/documents.html"     class="nav-item"><i class="bi bi-folder nav-icon"></i> Documents</a>
      <a href="/frontend/voting.html"        class="nav-item"><i class="bi bi-check2-square nav-icon"></i> Voting</a>
      <a href="/frontend/meetings.html"      class="nav-item"><i class="bi bi-calendar-event nav-icon"></i> Meetings</a>
      <a href="/frontend/calendar.html"      class="nav-item"><i class="bi bi-calendar3 nav-icon"></i> Calendar</a>
      <div class="nav-section">Communication</div>
      <a href="/frontend/notifications.html" class="nav-item"><i class="bi bi-bell nav-icon"></i> Notifications</a>
      <a href="/frontend/chat.html"          class="nav-item"><i class="bi bi-chat-dots nav-icon"></i> Chat</a>
      <div class="nav-section">Finance</div>
      <a href="/frontend/finances.html"      class="nav-item"><i class="bi bi-wallet2 nav-icon"></i> Finances</a>
      <a href="/frontend/analytics.html"     class="nav-item admin-only"><i class="bi bi-bar-chart nav-icon"></i> Analytics</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/frontend/profile.html" class="nav-item"><i class="bi bi-person-circle nav-icon"></i> Profile</a>
      <div class="user-info">
        <div class="avatar" id="avatarInitial"></div>
        <div>
          <div class="user-email" id="sidebarEmail"></div>
          <div class="user-role"  id="sidebarRole"></div>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <div>
        <a href="/frontend/voting.html" style="color:var(--text-muted);font-size:13px;text-decoration:none">
          <i class="bi bi-arrow-left me-1"></i>Back to Voting
        </a>
        <h1 id="ballotTitle" style="margin-top:4px">Results</h1>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" onclick="exportCSV()">
          <i class="bi bi-download me-1"></i>Export CSV
        </button>
        <button class="btn btn-outline-secondary btn-sm" onclick="exportPDF()">
          <i class="bi bi-file-earmark-pdf me-1"></i>Export PDF
        </button>
      </div>
    </div>

    <div id="resultsArea">
      <div class="card"><p class="text-muted text-center py-4">
        <span class="spinner-border spinner-border-sm me-2"></span>Loading results…
      </p></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/main.js"></script>
  <script>
    const params   = new URLSearchParams(window.location.search);
    const ballotId = params.get('id');
    if (!ballotId) window.location.href = '/frontend/voting.html';

    let _resultsData = null;
    let _resultsChart = null;

    Chart.defaults.color           = '#94a3b8';
    Chart.defaults.borderColor     = '#1e2d44';
    Chart.defaults.backgroundColor = '#1a2a42';

    async function loadResults() {
      const res = await fetch(`/api/v1/ballots/${ballotId}/results`, {
        headers: { 'Authorization': `Bearer ${getToken()}` }
      }).then(r => r.json());

      const area = document.getElementById('resultsArea');

      if (!res.success) {
        area.innerHTML = `
          <div class="card text-center py-5">
            <i class="bi bi-lock" style="font-size:40px;color:var(--text-muted)"></i>
            <p class="mt-3 text-muted">${res.error || 'Results not available yet.'}</p>
            <a href="/frontend/voting.html" class="btn btn-outline-secondary btn-sm mx-auto mt-2" style="width:fit-content">Back to Voting</a>
          </div>`;
        return;
      }

      _resultsData = res.data;
      const ballot  = _resultsData.ballot;
      const results = _resultsData.results;         // [{id, text, votes, percentage}]
      const total   = _resultsData.total_votes;
      const eligible= _resultsData.total_eligible;
      const turnout = _resultsData.turnout_percent;

      document.getElementById('ballotTitle').innerText = ballot.title;

      const maxVotes = Math.max(...results.map(r => r.votes), 0);
      const statusColor = { open:'var(--accent)', closed:'var(--danger)', draft:'var(--text-muted)' };

      area.innerHTML = `
        <!-- Status + summary -->
        <div class="d-flex gap-3 flex-wrap">
          <div class="stat-card" style="flex:1;min-width:140px">
            <div class="stat-label">Total Votes</div>
            <div class="stat-value">${total}</div>
          </div>
          <div class="stat-card" style="flex:1;min-width:140px">
            <div class="stat-label">Eligible Voters</div>
            <div class="stat-value">${eligible}</div>
          </div>
          <div class="turnout-card" style="flex:1;min-width:140px">
            <div class="turnout-label">Voter Turnout</div>
            <div class="turnout-val">${turnout}%</div>
          </div>
          <div class="stat-card" style="flex:1;min-width:140px">
            <div class="stat-label">Status</div>
            <div class="stat-value" style="font-size:15px;color:${statusColor[ballot.status]||'var(--text-primary)'}">${ballot.status.toUpperCase()}</div>
          </div>
        </div>

        <!-- Option bars -->
        <div class="card">
          <h2 class="card-title">Results Breakdown</h2>
          ${results.map(r => `
            <div class="result-option-bar">
              <div class="result-option-header">
                <span class="result-option-name">
                  ${r.text}
                  ${r.votes === maxVotes && maxVotes > 0 ? '<span class="winner-tag">Leading</span>' : ''}
                </span>
                <span class="result-pct">${r.percentage}%</span>
              </div>
              <div class="result-track">
                <div class="result-fill" style="width:${r.percentage}%"></div>
              </div>
              <div class="result-votes">${r.votes} vote${r.votes !== 1 ? 's' : ''}</div>
            </div>
          `).join('')}
        </div>

        <!-- Chart -->
        <div class="card">
          <h2 class="card-title">Visual Chart</h2>
          <canvas id="resultsChart" style="max-height:280px"></canvas>
        </div>
      `;

      // Draw chart
      if (_resultsChart) _resultsChart.destroy();
      _resultsChart = new Chart(document.getElementById('resultsChart'), {
        type: 'bar',
        data: {
          labels: results.map(r => r.text),
          datasets: [{
            label: 'Votes',
            data:  results.map(r => r.votes),
            backgroundColor: results.map((r, i) =>
              r.votes === maxVotes && maxVotes > 0
                ? '#0ea5e9'
                : ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6'][i % 5]
            ),
            borderRadius: 6,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ` ${ctx.raw} votes (${results[ctx.dataIndex].percentage}%)`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#64748b' },
              grid: { color: '#1e2d44' }
            },
            x: {
              grid: { display: false },
              ticks: {
                color: '#64748b',
                maxRotation: 45,
                minRotation: 0,
                autoSkip: true,
                maxTicksLimit: 10
              }
            }
          }
        }
      });
    }

    function exportCSV() {
      if (!_resultsData) return;
      const { ballot, results, total_votes, total_eligible, turnout_percent } = _resultsData;
      const rows = [
        ['Ballot', ballot.title],
        ['Status', ballot.status],
        ['Total Votes', total_votes],
        ['Eligible Voters', total_eligible],
        ['Voter Turnout', turnout_percent + '%'],
        [],
        ['Option', 'Votes', 'Percentage']
      ];
      results.forEach(r => rows.push([r.text, r.votes, r.percentage + '%']));
      const csv  = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `${ballot.title.replace(/\s+/g,'_')}_results.csv`;
      a.click();
    }

    function exportPDF() {
      if (!_resultsData) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const { ballot, results, total_votes, total_eligible, turnout_percent } = _resultsData;

      doc.setFontSize(16); doc.text(`Voting Results: ${ballot.title}`, 14, 18);
      doc.setFontSize(10);
      doc.text(`Status: ${ballot.status.toUpperCase()}`, 14, 28);
      doc.text(`Total Votes: ${total_votes}   Eligible: ${total_eligible}   Turnout: ${turnout_percent}%`, 14, 35);
      doc.line(14, 40, 196, 40);

      let y = 48;
      doc.setFontSize(11);
      doc.text('Option', 14, y); doc.text('Votes', 110, y); doc.text('%', 150, y);
      y += 5; doc.line(14, y, 196, y); y += 6;
      doc.setFontSize(10);
      results.forEach(r => {
        if (y > 270) { doc.addPage(); y = 18; }
        doc.text(String(r.text).slice(0, 60), 14, y);
        doc.text(String(r.votes), 110, y);
        doc.text(`${r.percentage}%`, 150, y);
        y += 8;
      });
      doc.save(`${ballot.title.replace(/\s+/g,'_')}_results.pdf`);
    }

    loadResults();
  </script>
</body>
</html>
